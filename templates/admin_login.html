<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Wifi Area</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f8f9fc;
        color: #1e293b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      form {
        background: #ffffff;
        padding: 32px;
        border-radius: 16px;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
      }
      h3 {
        margin: 0 0 6px;
        color: #4a3568;
      }
      p {
        margin: 0 0 18px;
        font-size: 0.85rem;
        color: #64748b;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.95rem;
      }
      input {
        border: 1px solid #cbd5e1;
        margin-bottom: 12px;
      }
      button {
        background: #4a3568;
        color: #fff;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .err {
        background: #fef2f2;
        color: #dc2626;
        padding: 8px;
        border-radius: 6px;
        font-size: 0.82rem;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <form method="POST">
      <h3>Wifi Area Admin</h3>
      <p>Connectez-vous pour gérer vos tickets</p>
      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}
      <input
        type="password"
        name="password"
        placeholder="Mot de passe administrateur"
        required
      />
      <button type="submit">Accéder au tableau de bord</button>
    </form>
  </body>
</html>
